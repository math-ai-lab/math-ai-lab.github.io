<svg class="neural-web-surface"
         viewBox="0 0 1600 760"
         preserveAspectRatio="none"
         focusable="false"
         xmlns="http://www.w3.org/2000/svg">

        <style>path{fill:none;stroke:url(#web-line-gradient);stroke-width:2.5}.web-node{fill:#18b9c7}</style><defs>

            <linearGradient id="web-line-gradient"
                            x1="0"
                            y1="0"
                            x2="1600"
                            y2="760"
                            gradientUnits="userSpaceOnUse">

                <stop offset="0"
                      stop-color="#18b9c7"
                      stop-opacity=".36"/>

                <stop offset=".48"
                      stop-color="#2167e8"
                      stop-opacity=".34"/>

                <stop offset="1"
                      stop-color="#7957e8"
                      stop-opacity=".14"/>

            </linearGradient>

            <radialGradient id="web-node-gradient">

                <stop offset="0"
                      stop-color="#ffffff"/>

                <stop offset=".35"
                      stop-color="#75dce4"/>

                <stop offset=".72"
                      stop-color="#438ee7"/>

                <stop offset="1"
                      stop-color="#2167e8"
                      stop-opacity=".18"/>

            </radialGradient>

        </defs>


